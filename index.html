<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Система звітів — АТ «Вінницяобленерго»</title>
<style>
  html,body{margin:0;height:100%;background:#050b24;font-family:"Segoe UI",Arial,sans-serif}
  #f{position:fixed;inset:0;width:100%;height:100%;border:0;visibility:hidden;background:#fff}
  #f.on{visibility:visible}
    #splash { position: fixed; inset: 0; z-index: 200; display: flex; flex-direction: column; align-items: center; justify-content: center;
              background: radial-gradient(circle at 50% 42%, #1e3a8a 0%, #0b1a4a 55%, #050b24 100%); color: #fff;
              transition: opacity .6s ease, transform .6s ease; }
    #splash.hide { opacity: 0; transform: scale(1.06); pointer-events: none; }
    #splash .sp-stage { position: relative; width: 300px; height: 300px; display: flex; align-items: center; justify-content: center; }
    #splash .sp-ring { position: absolute; inset: 0; border-radius: 50%;
                       background: conic-gradient(#facc15 0 33%, #dc2626 33% 66%, #2563eb 66% 100%);
                       -webkit-mask: radial-gradient(circle, transparent 62%, #000 63%, #000 66%, transparent 67%);
                       mask: radial-gradient(circle, transparent 62%, #000 63%, #000 66%, transparent 67%);
                       animation: spSpin 2.4s linear infinite, spFadeIn .6s ease both; }
    #splash .sp-glow { position: absolute; width: 260px; height: 260px; border-radius: 50%;
                       background: radial-gradient(circle, rgba(250, 204, 21, .55), rgba(250, 204, 21, 0) 70%); animation: spGlow 1.6s ease-in-out .5s infinite; }
    #splash .sp-logo { position: relative; width: 230px; height: 230px; border-radius: 50%; box-shadow: 0 0 0 6px rgba(255,255,255,.9), 0 20px 60px rgba(0,0,0,.45);
                       animation: spPop .9s cubic-bezier(.2, 1.4, .4, 1) both; }
    #splash .sp-flash { position: absolute; inset: 0; border-radius: 50%; background: radial-gradient(circle, rgba(255,255,255,.9), rgba(255,255,255,0) 60%);
                        opacity: 0; animation: spFlash .7s ease-out .8s both; }
    #splash .sp-name { margin-top: 30px; font-size: 28px; font-weight: 800; letter-spacing: .02em; animation: spUp .7s ease .55s both; text-align: center; padding: 0 16px; }
    #splash .sp-sub { margin-top: 8px; font-size: 15px; font-weight: 600; letter-spacing: .28em; text-transform: uppercase; color: #93c5fd; animation: spUp .7s ease .8s both; }
    #splash .sp-bar { margin-top: 28px; width: 220px; height: 4px; border-radius: 4px; background: rgba(255,255,255,.15); overflow: hidden; animation: spUp .5s ease 1s both; }
    #splash .sp-bar i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, #facc15, #dc2626, #2563eb); animation: spLoad 1.5s ease-in-out 1s forwards; }
    @keyframes spSpin { to { transform: rotate(360deg); } }
    @keyframes spFadeIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes spPop { 0% { transform: scale(.4) rotate(-25deg); opacity: 0; } 100% { transform: scale(1) rotate(0); opacity: 1; } }
    @keyframes spGlow { 0%, 100% { transform: scale(.92); opacity: .55; } 50% { transform: scale(1.12); opacity: 1; } }
    @keyframes spFlash { 0% { opacity: 0; } 30% { opacity: 1; } 100% { opacity: 0; } }
    @keyframes spUp { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
    @keyframes spLoad { to { width: 100%; } }
    @media (max-width: 520px) { #splash .sp-stage { width: 240px; height: 240px; } #splash .sp-logo { width: 180px; height: 180px; } #splash .sp-name { font-size: 22px; } }
    @media (prefers-reduced-motion: reduce) { #splash * { animation-duration: .01s !important; animation-delay: 0s !important; } }

    .container { width: 100%; max-width: 900px; }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
      background: var(--card-bg);
      padding: 24px 32px;
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow);
      margin-bottom: 24px;
      border: 1px solid var(--border);
    }

    .brand { display: flex; align-items: center; gap: 16px; }
    .brand img { height: 50px; width: auto; }
    .brand-title h1 { font-size: 26px; font-weight: 700; color: #0f172a; }

    /* ---------- Вхід за кодом з пошти ---------- */
    .login { max-width: 520px; margin: 0 auto 24px; }
    .login p.lg-note { color: var(--text-muted); font-size: 14px; line-height: 1.5; margin: 6px 0 16px; }
    .lg-row { display: flex; gap: 10px; }
    .lg-row input { flex: 1; min-width: 0; padding: 13px 14px; border: 1px solid var(--border); border-radius: 10px; font-size: 16px; font-family: inherit; }
    .lg-row input:focus { outline: 2px solid #93c5fd; border-color: #3b82f6; }
    #lgCode { letter-spacing: .35em; font-weight: 700; text-align: center; }
    .lg-row .btn { width: auto; padding: 0 20px; white-space: nowrap; }
    .lg-links { margin-top: 12px; font-size: 13px; color: var(--text-muted); }
    .lg-links a { color: #1d4ed8; text-decoration: none; font-weight: 600; }
    .lg-msg { margin-top: 12px; font-size: 14px; min-height: 20px; }
    .lg-msg.err { color: #b91c1c; } .lg-msg.ok { color: #166534; }
    .logout { margin-left: 6px; border: 0; background: none; color: #1d4ed8; font: 600 13px inherit; cursor: pointer; text-decoration: underline; padding: 0; }
    .link-row { display: flex; gap: 8px; margin-top: 10px; }
    .link-row input { flex: 1; min-width: 0; padding: 10px 12px; border: 1px solid var(--border); border-radius: 8px; font-size: 14px; font-family: inherit; }
    .link-row .btn { width: auto; padding: 0 16px; font-size: 14px; }
    @media (max-width: 520px) { .lg-row { flex-direction: column; } .lg-row .btn { padding: 12px; } }

    .user-badge {
      background: #eff6ff;
      color: #1e40af;
      padding: 10px 18px;
      border-radius: 30px;
      font-size: 14px;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn-large {
      width: 100%;
      padding: 18px;
      background-color: var(--accent);
      color: white;
      border: none;
      border-radius: var(--radius-md);
      font-weight: 600;
      font-size: 16px;
      cursor: pointer;
      margin-bottom: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: background-color 0.2s;
    }
    .btn-large:hover { background-color: #1e293b; }
    .btn-large:disabled { opacity: 0.5; cursor: not-allowed; }

    .card {
      background: var(--card-bg);
      border-radius: var(--radius-lg);
      padding: 30px 32px;
      box-shadow: var(--shadow);
      margin-bottom: 24px;
      border: 1px solid var(--border);
    }

    .card h2 {
      font-size: 16px;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .card h2 i { color: var(--secondary); font-size: 18px; }

    .filters-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 20px; }

    .input-group { display: flex; flex-direction: column; gap: 8px; position: relative; }
    .input-group label {
      font-size: 14px;
      font-weight: 500;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .input-group label i { color: var(--secondary); font-size: 14px; width: 16px; text-align: center; }

    select, input {
      width: 100%;
      padding: 14px 16px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 15px;
      outline: none;
      transition: all 0.2s;
      background: #f9fafb;
    }
    select:focus, input:focus {
      border-color: var(--primary);
      background: #ffffff;
      box-shadow: 0 0 0 3px rgba(30, 64, 175, 0.1);
    }

    .actions-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 16px; }

    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 16px 20px;
      font-size: 15px;
      font-weight: 600;
      color: #ffffff;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn i { font-size: 16px; }

    .btn-primary { background-color: var(--primary); }
    .btn-primary:hover { background-color: var(--primary-hover); transform: translateY(-1px); }

    .btn-secondary { background-color: var(--secondary); }
    .btn-secondary:hover { background-color: #2563eb; transform: translateY(-1px); }

    .btn-accent { background-color: var(--accent); }
    .btn-drive { background: linear-gradient(135deg, #1a73e8, #0f9d58); }
    .btn-drive:hover { filter: brightness(1.07); transform: translateY(-1px); }
    .btn-upload { background-color: #059669; }
    .btn-upload:hover { background-color: #047857; transform: translateY(-1px); }
    .btn-accent:hover { background-color: #1e293b; transform: translateY(-1px); }

    .btn:active { transform: translateY(0); }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

    .dashboard-link-container {
      display: flex;
      flex-wrap: wrap;
      gap: 12px 28px;
      margin-top: 24px;
      border-top: 1px solid var(--border);
      padding-top: 16px;
    }

    .dashboard-link {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: var(--primary);
      font-weight: 600;
      text-decoration: none;
      font-size: 15px;
      transition: gap 0.2s;
    }
    .dashboard-link i { font-size: 16px; }
    button.dashboard-link { background: none; border: none; cursor: pointer; padding: 0; font-family: inherit; }
    .list-sec { padding: 12px 12px 4px; font-size: 12px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: .05em; }
    .file-item.kd i { color: #7c3aed; }
    .tabs { display: flex; gap: 4px; padding: 12px 24px 0; border-bottom: 1px solid var(--border); overflow-x: auto; }
    .tab { white-space: nowrap; }
    .drive-note a { color: var(--primary); font-weight: 600; }
    .tab { background: none; border: none; border-bottom: 3px solid transparent; padding: 10px 14px; font: 600 14px Inter, sans-serif; color: var(--text-muted); cursor: pointer; display: inline-flex; align-items: center; gap: 8px; }
    .tab.on { color: var(--primary); border-bottom-color: var(--primary); }
    .tab-body { overflow-y: auto; }
    #tabPc { padding: 20px 24px 24px; }
    .drop { border: 2px dashed #cbd5e1; border-radius: 14px; padding: 32px 20px; display: flex; flex-direction: column; align-items: center; gap: 10px; text-align: center; color: var(--text-muted); transition: all .15s; }
    .drop i { font-size: 36px; color: #059669; }
    .drop b { color: var(--text); font-size: 16px; }
    .drop small { font-size: 12px; }
    .drop.over { border-color: #059669; background: #ecfdf5; }
    .drop .btn { padding: 12px 22px; }
    .drive-note { font-size: 12px; color: var(--text-muted); margin-top: 8px; }
    .recent-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
    .recent-head h2 { margin-bottom: 0; }
    .link-btn { background: none; border: none; color: var(--text-muted); font: 500 13px Inter, sans-serif; cursor: pointer; text-decoration: underline; }
    .ri { display: flex; gap: 14px; align-items: flex-start; padding: 12px 4px; border-top: 1px solid var(--border); }
    .ri:first-child { border-top: none; }
    .ri .ic { width: 28px; height: 28px; border-radius: 50%; display: flex; align-items: center; justify-content: center; flex-shrink: 0; font-size: 14px; }
    .ri.ok .ic { background: #d1fae5; color: #047857; }
    .ri.dup .ic, .ri.slow .ic { background: #fef3c7; color: #b45309; }
    .ri.err .ic { background: #fee2e2; color: #b91c1c; }
    .ri.wait .ic { background: #e0e7ff; color: var(--primary); }
    .ri .nm { font-weight: 600; font-size: 15px; word-break: break-word; }
    .ri .ds { font-size: 13px; color: var(--text-muted); margin-top: 2px; }
    .ri a { color: var(--primary); font-weight: 600; font-size: 13px; text-decoration: none; }
    .ri a:hover { text-decoration: underline; }
    .ri .tm { margin-left: auto; font-size: 12px; color: var(--text-muted); white-space: nowrap; }
    .file-item.seen i { color: var(--primary); }
    .file-item.new i { color: #9ca3af; }
    .dashboard-link:hover { gap: 12px; }

    #status {
      padding: 16px;
      border-radius: 8px;
      background: #f1f5f9;
      font-size: 14px;
      color: var(--text);
      display: none;
      margin-top: 16px;
      white-space: pre-line;
    }
    #status.show { display: block; }
    #status.error { background: #fef2f2; color: #991b1b; }
    #status.success { background: #ecfdf5; color: #065f46; }

    /* Вікно вибору файлу */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 50;
    }
    .modal {
      background: var(--card-bg);
      border-radius: var(--radius-lg);
      width: 100%;
      max-width: 560px;
      max-height: 80vh;
      display: flex;
      flex-direction: column;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
    }
    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 20px 24px;
      border-bottom: 1px solid var(--border);
    }
    .modal-header h3 { font-size: 18px; font-weight: 600; display: flex; align-items: center; gap: 10px; }
    .modal-header h3 i { color: #16a34a; }
    .icon-btn { background: none; border: none; font-size: 20px; color: var(--text-muted); cursor: pointer; padding: 4px 8px; }
    .icon-btn:hover { color: var(--text); }
    .modal-search { padding: 16px 24px; }
    .file-list { overflow-y: auto; padding: 0 12px 12px; }
    .file-item {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 12px;
      border: none;
      background: none;
      border-radius: 8px;
      cursor: pointer;
      text-align: left;
    }
    .file-item:hover { background: #eff6ff; }
    .file-item input[type=checkbox] { width: 18px; height: 18px; accent-color: #059669; flex-shrink: 0; cursor: pointer; margin: 0; }
    .file-item.sel { background: #ecfdf5; }
    .sel-bar { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 24px 16px; border-top: 1px solid var(--border); }
    .sel-bar span { font-size: 13px; color: var(--text-muted); }
    .sel-bar .btn { padding: 10px 18px; font-size: 14px; }
    .file-item i { font-size: 24px; color: #16a34a; width: 24px; text-align: center; }
    .file-name { font-weight: 500; font-size: 15px; color: var(--text); word-break: break-word; }
    .file-meta { font-size: 13px; color: var(--text-muted); margin-top: 2px; }
    .list-info { padding: 20px 12px; color: var(--text-muted); font-size: 14px; text-align: center; }
    .confirm-modal { max-width: 460px; }
    .confirm-body { padding: 20px 24px; font-size: 15px; line-height: 1.5; white-space: pre-line; }
    .confirm-actions { display: flex; justify-content: flex-end; gap: 12px; padding: 0 24px 20px; }
    .btn-light { background: #f1f5f9; color: var(--text); }
    .btn-light:hover { background: #e2e8f0; }

    @media (max-width: 600px) {
      .tabs { padding: 8px 12px 0; gap: 2px; }
      .tab { flex: 1; white-space: normal; justify-content: center; text-align: center; padding: 8px 6px; font-size: 13px; line-height: 1.25; }
      .tab i { display: none; }
      body { padding: 20px 16px; }
      .header, .card { padding: 20px; }
    }
  #splash.wait .sp-bar i{animation:spLoad 1.5s ease-in-out 1s forwards,spWait 1.2s ease-in-out 2.5s infinite}
  @keyframes spWait{0%{opacity:1}50%{opacity:.45}100%{opacity:1}}
  #splash .sp-err{display:none;margin-top:22px;max-width:420px;font-size:14px;color:#fecaca;text-align:center;padding:0 16px}
  #splash .sp-err button{margin-top:12px;padding:9px 18px;border:0;border-radius:8px;background:#facc15;color:#0b1a4a;font-weight:700;cursor:pointer}
  #splash.err .sp-err{display:block}
  #splash.err .sp-bar,#splash.err .sp-ring{display:none}
  #splash.quick *{animation-delay:0s!important;animation-duration:.3s!important}
  #splash.quick .sp-ring{animation:spSpin 2.4s linear infinite!important}
  #splash.quick .sp-bar i{width:60%;animation:spWait 1.2s ease-in-out infinite!important}
</style>
</head>

  var sp = document.getElementById("splash"), t0 = Date.now(), first = true;
  // повна анімація — один раз за сеанс вкладки; при переходах між сторінками — коротка заставка
  try { first = sessionStorage.getItem("rs.splash") !== "1"; sessionStorage.setItem("rs.splash", "1"); } catch (e) {}
  if (!first) sp.classList.add("quick");

  function hideSplash() {
    var wait = first ? Math.max(0, 2600 - (Date.now() - t0)) : 0;
    setTimeout(function () {
      document.getElementById("f").classList.add("on");
      sp.classList.add("hide");
      setTimeout(function () { sp.remove(); }, 650);
    }, wait);
  }

  // Усе після «#» — це шлях і параметри сторінки: #/k/<ключ>?page=vm
  function load() {
    var h = location.hash.slice(1), qi = h.indexOf("?");
    var m = /^\/k\/([0-9a-f]{64})/.exec(qi < 0 ? h : h.slice(0, qi));
    var url = API + "?api=page&b=" + encodeURIComponent(location.href.split("#")[0]) +
      (m ? "&k=" + m[1] : "") + (qi < 0 ? "" : "&" + h.slice(qi + 1));
    // credentials:"omit" — без куків Google, тому кількість акаунтів у браузері не заважає
    fetch(url, { credentials: "omit" })
      .then(function (r) { if (!r.ok) throw new Error("HTTP " + r.status); return r.text(); })
      .then(function (html) {
        if (!/<(html|head|body|div|script)/i.test(html)) throw new Error(html.slice(0, 200));
        var f = document.getElementById("f");
        f.onload = function () {
          try { if (f.contentDocument.title) document.title = f.contentDocument.title; } catch (e) {}
          hideSplash();
        };
        f.srcdoc = html;
      })
      .catch(function (e) {
        sp.classList.add("err");
        document.getElementById("msg").textContent = "Не вдалося завантажити систему (" + e.message + ").";
      });
  }
  // перехід між сторінками системи змінює лише «#…» — перезавантажуємо
  window.addEventListener("hashchange", function () { location.reload(); });
  load();
</script>
</body>
</html>
