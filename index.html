<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Система звітів — АТ «Вінницяобленерго»</title>
<style>
  html,body{margin:0;height:100%;background:#0b1f3a;font-family:Arial,sans-serif}
  #f{position:fixed;inset:0;width:100%;height:100%;border:0;display:none;background:#fff}
  #ld{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;color:#cfe0ff;font-size:15px;text-align:center;padding:0 16px}
  #ld i{width:42px;height:42px;border:4px solid rgba(255,255,255,.18);border-top-color:#2fe0a8;border-radius:50%;animation:r 1s linear infinite}
  #ld button{display:none;padding:10px 18px;border:0;border-radius:8px;background:#2fe0a8;color:#06243a;font-weight:bold;cursor:pointer}
  @keyframes r{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div id="ld"><i></i><span id="msg">Завантаження «Системи звітів»…</span><button onclick="location.reload()">Спробувати ще раз</button></div>
<iframe id="f" title="Система звітів"></iframe>
<script>
  // Адреса розгортання Apps Script («Розгорнути» → «Керувати розгортаннями» → URL веб-програми)
  var API = "https://script.google.com/macros/s/AKfycbwuV2g_DNxh21aoKqcuj_RamxeESHqowOie7LaI3K53ERnRjdjGx-Pems8PjWNhLHww5w/exec";

  // Усе після «#» — це шлях і параметри сторінки: #/k/<ключ>?page=vm
  function load() {
    var h = location.hash.slice(1), qi = h.indexOf("?");
    var m = /^\/k\/([0-9a-f]{64})/.exec(qi < 0 ? h : h.slice(0, qi));
    var url = API + "?api=page&b=" + encodeURIComponent(location.href.split("#")[0]) +
      (m ? "&k=" + m[1] : "") + (qi < 0 ? "" : "&" + h.slice(qi + 1));
    // credentials:"omit" — без куків Google, тому кількість акаунтів у браузері не заважає
    fetch(url, { credentials: "omit" })
      .then(function (r) { if (!r.ok) throw new Error("HTTP " + r.status); return r.text(); })
      .then(function (html) {
        if (!/<(html|head|body|div|script)/i.test(html)) throw new Error(html.slice(0, 200));
        var f = document.getElementById("f");
        f.onload = function () {
          f.style.display = "block";
          document.getElementById("ld").style.display = "none";
          try { if (f.contentDocument.title) document.title = f.contentDocument.title; } catch (e) {}
        };
        f.srcdoc = html;
      })
      .catch(function (e) {
        document.querySelector("#ld i").style.display = "none";
        document.getElementById("msg").textContent = "Не вдалося завантажити систему (" + e.message + ").";
        document.querySelector("#ld button").style.display = "inline-block";
      });
  }
  // перехід між сторінками системи змінює лише «#…» — перезавантажуємо
  window.addEventListener("hashchange", function () { location.reload(); });
  load();
</script>
</body>
</html>
